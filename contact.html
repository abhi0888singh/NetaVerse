<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Contact NetaVerse for feedback, suggestions, corrections and enquiries."
  >

  <meta name="author" content="Abhijeet Singh">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="header-top">

      <div class="brand">
        <h1>🌐 Neta<span>Verse</span></h1>

        <p class="tagline">
          Explore India’s Political Universe
        </p>
      </div>

      <details class="menu-container">

        <summary class="menu-toggle" aria-label="Open navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>

        <div class="menu-panel">

          <nav>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="news.html">News</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
          </nav>

          <div class="menu-socials">

            <a
              href="mailto:abhijeetsinghhh1111@gmail.com"
              class="social-icon"
              aria-label="Email NetaVerse"
              title="Email NetaVerse"
            >✉</a>

            <a
              href="https://x.com/Abhijeet8040"
              target="_blank"
              rel="noopener noreferrer"
              class="social-icon x-social"
              aria-label="NetaVerse on X"
              title="NetaVerse on X"
            >𝕏</a>

          </div>

        </div>

      </details>

    </div>

  </header>


  <!-- CONTACT SECTION -->
  <main class="contact-card">

    <h2>Contact NetaVerse</h2>

    <p class="contact-intro">
      Have a suggestion, correction, feedback or enquiry?
      Get in touch with us.
    </p>

    <h2 class="enquiry-title">
      Send an Enquiry
    </h2>

    <form
      class="enquiry-form"
      action="https://formspree.io/f/mrpbkyyz"
      method="POST"
    >

      <label for="name">Name</label>

      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
      >


      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      >


      <label for="subject">Subject</label>

      <input
        type="text"
        id="subject"
        name="subject"
        placeholder="Enter subject"
        required
      >


      <label for="message">Message</label>

      <textarea
        id="message"
        name="message"
        rows="6"
        placeholder="Write your message..."
        required
      ></textarea>


      <button type="submit">
        Send Enquiry
      </button>

    </form>


    <p class="highlight">
      NetaVerse — Information. Development. Democracy.
    </p>

  </main>


  <!-- FOOTER -->
  <footer>
    © 2026 NetaVerse | Built by Abhijeet Singh
  </footer>

</body>
</html>
